<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Display -->
        <input type="text" id="display" value="0" readonly>

        <!-- Buttons -->
        <div class="buttons">

            <button class="clear" onclick="calculator.clearDisplay()">AC</button>

            <button class="operator" onclick="calculator.delete()">⌫</button>

            <button class="operator" onclick="calculator.chooseOperator('%')">%</button>

            <button class="operator" onclick="calculator.chooseOperator('/')">÷</button>


            <button onclick="calculator.numberClick('7')">7</button>
            <button onclick="calculator.numberClick('8')">8</button>
            <button onclick="calculator.numberClick('9')">9</button>

            <button class="operator" onclick="calculator.chooseOperator('*')">×</button>


            <button onclick="calculator.numberClick('4')">4</button>
            <button onclick="calculator.numberClick('5')">5</button>
            <button onclick="calculator.numberClick('6')">6</button>

            <button class="operator" onclick="calculator.chooseOperator('-')">−</button>


            <button onclick="calculator.numberClick('1')">1</button>
            <button onclick="calculator.numberClick('2')">2</button>
            <button onclick="calculator.numberClick('3')">3</button>

            <button class="operator" onclick="calculator.chooseOperator('+')">+</button>


            <button class="zero" onclick="calculator.numberClick('0')">0</button>

            <button onclick="calculator.addDot()">.</button>

            <button class="equal" onclick="calculator.calculate()">=</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
